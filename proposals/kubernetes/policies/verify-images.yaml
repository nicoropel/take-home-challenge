apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-atlas-api-image
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: false
  rules:
    - name: verify-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [atlas-production]
      verifyImages:
        - imageReferences:
            # Fails closed: an image from another repository that shares this prefix is also required to be signed.
            - registry.example/atlas-api*
          required: true
          mutateDigest: true
          verifyDigest: true
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/atlas-company/platform-atlas/.github/workflows/publish.yaml@refs/heads/main
                    rekor:
                      url: https://rekor.sigstore.dev
          
          attestations:                               
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subject: https://github.com/atlas-company/platform-atlas/.github/workflows/publish.yaml@refs/heads/main
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    - key: "{{ buildDefinition.externalParameters.workflow.repository }}"
                      operator: Equals
                      value: "https://github.com/atlas-company/platform-atlas"
                    - key: "{{ buildDefinition.externalParameters.workflow.ref }}"
                      operator: Equals
                      value: "refs/heads/main"